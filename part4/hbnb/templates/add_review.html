<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="/static/images/logo.png"> <title>HBNB - Review</title> <link rel="stylesheet" href="/static/styles.css">
        <script src="/static/scripts.js"></script>
    </head>
<body>
    {% include "includes/_header.html" %}

    <main>
        <section id="add-review-section">
            <form id="review-form">
                <h2>Add a Review</h2>
                <div class="form-group">
                    <label for="review-text">Your Review:</label>
                    <textarea id="review-text" name="review" required placeholder="Tell us about your stay..."></textarea>
                </div>
                <div class="form-group">
                    <label for="star-rating">Rating:</label>
                    <select id="star-rating" name="rating" required>
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Very Good</option>
                        <option value="3">3 - Good</option>
                        <option value="2">2 - Fair</option>
                        <option value="1">1 - Poor</option>
                    </select>
                </div>
                <button type="submit" class="login-button">Submit Review</button>
            </form>
        </section>
    </main>

    {% include "includes/_footer.html" %}
</body>
</html>
