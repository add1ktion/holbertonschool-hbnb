<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">
                <img src="images/logo.png" alt="HBnB Logo" class="logo">
            </a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
        </nav>
    </header>

    <main>
        <section id="place-details" class="place-details">
           
            <div class="place-info">
                <h1>Title of the Place</h1>
                <p><b>Host:</b> Host Name</p>
                <p><b>Price:</b> $150 per night</p>
                <p><b>Description:</b> Detailed description goes here.</p>
                <p><b>Amenities:</b> WiFi, Kitchen, etc.</p>
            </div>

            <div id="reviews">
                <h2>Reviews</h2>
                <div class="review-card">
                    <p>"Great stay!"</p>
                    <p><b>User:</b> John Doe</p>
                    <p><b>Rating:</b> 4/5</p>
                </div>
            </div>

            <a href="add_review.html" class="button">Add Review</a>

            <form id="review-form" class="add-review form">
                <h3>Leave a Review</h3>
            </form>

        </section>

        <section id="add-review">
            <h2>Add a Review</h2>
            <form id="review-form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="scripts.js"></script>
    <footer>
        <p>All rights reserved.</p>
    </footer>
</body>
</html>
